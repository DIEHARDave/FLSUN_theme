# FLSUN_theme - keeps the Mainsail theme up to date through Mainsail's and
# Fluidd's update manager. install.sh links this file into the config folder
# and includes it from moonraker.conf; don't edit it.

[update_manager flsun_theme]
type: git_repo
channel: dev
primary_branch: main
path: ~/FLSUN_theme
origin: https://github.com/DIEHARDave/FLSUN_theme.git
# Mainsail reads the theme when the page loads; no service needs a restart.
is_system_service: False
